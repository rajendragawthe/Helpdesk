# .github/workflows/ci.yml
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Helpdesk.slnx
      - name: Build
        run: dotnet build Helpdesk.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test Helpdesk.slnx --no-build --configuration Release
      - name: Compile Bicep templates
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/helpdesk-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/helpdesk-web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
